name: build-installer

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp release tag to bundle. b12244 was verified (asset names, flags, tiny-model run). Newest tags can exist before their assets do."
        default: "b12244"

permissions:
  contents: write   # only used to attach installers to a tagged release

# a newer push cancels the older run of the same branch (saves runner minutes); tags are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  LLAMA_TAG: ${{ inputs.llama_tag || 'b12244' }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # Linux: everything that can be proven without Windows, INCLUDING a run against the REAL llama-server
  # ---------------------------------------------------------------------------------------------
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Real llama-server (Linux build, same server code) + tiny random Gemma-3-architecture model
        run: |
          pip install gguf numpy
          python tools/make_tiny_gemma3.py "$RUNNER_TEMP/tiny.gguf"
          curl -fsSL -o "$RUNNER_TEMP/llama.tgz" "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/llama" && tar xzf "$RUNNER_TEMP/llama.tgz" -C "$RUNNER_TEMP/llama"
          echo "MG_REAL_LLAMA_DIR=$(dirname "$(find "$RUNNER_TEMP/llama" -name llama-server -type f | head -1)")" >> "$GITHUB_ENV"
          echo "MG_TINY_GGUF=$RUNNER_TEMP/tiny.gguf" >> "$GITHUB_ENV"

      - name: Rust unit + integration tests (planner, selection, supervisor, REAL llama-server end-to-end)
        run: cargo test -p mg-core -- --test-threads=1 --nocapture

      - name: TypeScript tests (report parsing, CSV summary, real PDF generation)
        run: |
          npm ci
          npm test

      - name: Build UI and run the OFFLINE AUDIT (no CDN / fonts / external hosts)
        run: |
          npm run build
          python tools/offline_audit.py

      - name: Artifact checker self-test (proves it rejects bad installers)
        run: python tools/check_artifacts.py --selftest

  # ---------------------------------------------------------------------------------------------
  # Real browser engine (Firefox, preinstalled on the runner) drives the BUILT UI against a mocked backend:
  # re-link dialog, streaming into clinical cards, live tok/s, variant selector, forced-slow warning, report dialog, camera, theme.
  # ---------------------------------------------------------------------------------------------
  ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          npm ci
          npm run build
          pip install selenium
      - name: Drive the UI in Firefox (headless) and save screenshots
        run: python tools/ui_check.py ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Windows: build the real installer and smoke-test it on a real Windows runner
  # ---------------------------------------------------------------------------------------------
  build:
    needs: [verify-linux, ui-browser]
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # false = small installer (needs WebView2 already on the PC; Win11 / updated Win10 have it)
        # true  = + ~170 MB offline WebView2 runtime so a clean Win10 / LTSC needs no internet
        bundle_webview2: [false, true]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Rust tests on Windows (hardware detection APIs, planner, backend)
        run: cargo test -p mg-core -- --test-threads=1

      - name: Build UI + native shell (Tauri, exe only - Inno Setup does the installing)
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Build installer helper (hardware probe + planner)
        run: cargo build --release -p mg-probe

      - name: Fetch + trim llama.cpp engines (CPU + Vulkan GPU), pinned tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dl | Out-Null
          foreach ($v in @(@('cpu','cpu'), @('vulkan','vulkan'))) {
            $asset = "llama-$env:LLAMA_TAG-bin-win-$($v[0])-x64.zip"
            $got = $false
            foreach ($try in 1..3) { gh release download $env:LLAMA_TAG -R ggml-org/llama.cpp -p $asset -D dl --clobber; if ($LASTEXITCODE -eq 0) { $got = $true; break }; Start-Sleep (5 * $try) }
            if (-not $got) { throw "could not download $asset after 3 attempts" }
            python tools/stage_engines.py "dl/$asset" "staging/backend/$($v[1])"
            if ($LASTEXITCODE -ne 0) { throw "staging $asset failed" }
          }

      - name: SMOKE TEST on real Windows - hardware probe + planner
        shell: pwsh
        run: |
          Copy-Item target\release\mg-probe.exe staging\ ; New-Item -ItemType Directory -Force staging\app | Out-Null
          Copy-Item target\release\medgemma-offline.exe staging\app\
          .\staging\mg-probe.exe hw
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\models" | Out-Null
          foreach ($n in @(@('medgemma-4b-it-Q8_0.gguf',4.1),@('mmproj-medgemma-4b-it-F16.gguf',0.85))) {
            $f = [System.IO.File]::Create("$env:RUNNER_TEMP\models\$($n[0])"); $f.SetLength([int64]($n[1]*1GB)); $f.Close()
          }
          .\staging\mg-probe.exe plan --dir "$env:RUNNER_TEMP\models" --compute cpu
          .\staging\mg-probe.exe plan --dir "$env:RUNNER_TEMP\models" --compute cpu --out "$env:RUNNER_TEMP\plan.txt"
          if (-not (Select-String -Path "$env:RUNNER_TEMP\plan.txt" -Pattern '^status=ok')) { throw 'planner did not return status=ok' }

      - name: SMOKE TEST on real Windows - staged llama-server.exe serves a Gemma-3-architecture model
        shell: pwsh
        run: |
          pip install gguf numpy
          python tools/make_tiny_gemma3.py "$env:RUNNER_TEMP\tiny.gguf"
          $dir = (Resolve-Path staging\backend\cpu).Path
          $p = Start-Process -FilePath "$dir\llama-server.exe" -WorkingDirectory $dir -PassThru -WindowStyle Hidden `
               -ArgumentList @('-m',"$env:RUNNER_TEMP\tiny.gguf",'--host','127.0.0.1','--port','18123','--api-key','k3y','-c','512','-np','1','-ngl','0','--no-webui','--no-warmup','--cache-ram','0','--offline')
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { Start-Sleep 1; try { if ((Invoke-WebRequest http://127.0.0.1:18123/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {} }
          if (-not $ok) { $p.Kill(); throw 'llama-server.exe never became healthy' }
          $r = Invoke-RestMethod http://127.0.0.1:18123/v1/chat/completions -Method Post -Headers @{Authorization='Bearer k3y'} -ContentType 'application/json' -Body '{"messages":[{"role":"user","content":"hello"}],"max_tokens":5}'
          "server reply tok/s: $($r.timings.predicted_per_second)"
          if (-not $r.timings.predicted_per_second) { throw 'no timings in reply' }
          $p.Kill()

      - name: Stage files for the installer
        shell: pwsh
        run: |
          if ('${{ matrix.bundle_webview2 }}' -eq 'true') {
            # Evergreen *Standalone* x64 installer (works offline on the target PC). Downloaded here in CI only.
            foreach ($try in 1..3) { try { Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile staging\MicrosoftEdgeWebView2RuntimeInstallerX64.exe; break } catch { if ($try -eq 3) { throw }; Start-Sleep (5 * $try) } }
            if ((Get-Item staging\MicrosoftEdgeWebView2RuntimeInstallerX64.exe).Length -lt 100MB) { throw 'WebView2 standalone download looks wrong' }
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-ci' }
          $defs = @("/DAppVersion=$ver")
          if ('${{ matrix.bundle_webview2 }}' -eq 'true') { $defs += '/DBundleWebView2' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @defs installer\medgemma.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          "APP_VER=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem out | ForEach-Object { "{0}  {1:N1} MB  sha256={2}" -f $_.Name, ($_.Length / 1MB), (Get-FileHash $_.FullName).Hash }
          Get-ChildItem out\*.exe | ForEach-Object { (Get-FileHash $_.FullName).Hash + "  " + $_.Name } | Set-Content out\SHA256SUMS.txt

      - name: Build an OLDER version (0.0.1) of the bundled installer for the upgrade test
        if: matrix.bundle_webview2
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.1 /DFastCompress /DBundleWebView2 "/O$env:RUNNER_TEMP\old" installer\medgemma.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC (old version) failed' }

      # The installers are delivered first: a failing test below turns the job red but never hides the artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: MedGemmaOffline-installer-${{ matrix.bundle_webview2 && 'with-webview2' || 'slim' }}
          path: |
            out/*.exe
            out/SHA256SUMS.txt
          compression-level: 0     # already LZMA2-compressed

      - name: LIFECYCLE (slim installer) - install / verify / uninstall, or correct refusal when WebView2 is absent
        if: '!matrix.bundle_webview2'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out\MedGemmaOffline-Setup-*.exe | Where-Object { $_.Name -notlike '*with-WebView2*' } | Select-Object -First 1).FullName
          $app = "$env:RUNNER_TEMP\SlimInstalled"
          $hasWv2 = (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') -or (Test-Path 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $args = "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$app`"","/COMPUTE=cpu","/MODELDIR=`"$env:RUNNER_TEMP\models`"","/LOG=`"$env:RUNNER_TEMP\slim.log`""
          $p = Start-Process $setup -Wait -PassThru -ArgumentList $args
          if ($hasWv2) {
            "WebView2 present on this runner: slim installer must install cleanly (exit $($p.ExitCode))"
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\slim.log" -Tail 30; throw 'slim silent install failed' }
            ./tools/verify_install.ps1 -Phase installed -AppDir $app -Version $env:APP_VER
            & "$app\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES | Out-Null; Start-Sleep 4
            ./tools/verify_install.ps1 -Phase uninstalled -AppDir $app
          } else {
            "No WebView2 on this runner: the slim installer must REFUSE (exit $($p.ExitCode)) and install nothing"
            if ($p.ExitCode -eq 0) { throw 'slim installer should refuse without WebView2' }
            if (Test-Path "$app\medgemma-offline.exe") { throw 'slim installer left files behind' }
          }

      - name: EVIDENCE - drive the REAL wizard with the REAL mg-probe (keystrokes + screenshots + state assertions)
        if: matrix.bundle_webview2
        shell: pwsh
        continue-on-error: true      # needs an interactive desktop; the evidence is uploaded either way
        run: |
          pip install gguf numpy
          $good = "$env:RUNNER_TEMP\e2e-models"; New-Item -ItemType Directory -Force "$good\4b" | Out-Null
          python tools/make_tiny_gemma3.py "$good\4b\medgemma-4b-it-F32.gguf"
          $setup = (Get-ChildItem out\MedGemmaOffline-Setup-*-with-WebView2.exe | Select-Object -First 1).FullName
          ./tools/drive_wizard.ps1 -Setup $setup -ModelDir $good -OutDir "$env:RUNNER_TEMP\wizard-evidence"

      - name: LIFECYCLE (bundled installer) - install OLD 0.0.1, UPGRADE to current, verify registration/shortcuts/stale-file cleanup
        if: matrix.bundle_webview2
        shell: pwsh
        run: |
          $old = (Get-ChildItem "$env:RUNNER_TEMP\old\*.exe" | Select-Object -First 1).FullName
          $new = (Get-ChildItem out\MedGemmaOffline-Setup-*-with-WebView2.exe | Select-Object -First 1).FullName
          $app = "$env:RUNNER_TEMP\MedGemmaInstalled"
          $common = "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$app`"","/TASKS=desktopicon","/COMPUTE=cpu","/MODELDIR=`"$env:RUNNER_TEMP\models`""
          $p = Start-Process $old -Wait -PassThru -ArgumentList ($common + "/LOG=`"$env:RUNNER_TEMP\old.log`"")
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\old.log" -Tail 40; throw 'install of the OLD version failed' }
          ./tools/verify_install.ps1 -Phase installed -AppDir $app -Version '0.0.1' -DesktopIcon
          'stale' | Set-Content "$app\backend\cpu\stale-from-old.dll"          # must disappear on upgrade
          $p = Start-Process $new -Wait -PassThru -ArgumentList ($common + "/LOG=`"$env:RUNNER_TEMP\upgrade.log`"")
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\upgrade.log" -Tail 40; throw 'UPGRADE install failed' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\upgrade.log" -Pattern 'UPGRADE: previous version 0.0.1')) { throw 'upgrade was not detected in the setup log' }
          ./tools/verify_install.ps1 -Phase installed -AppDir $app -Version $env:APP_VER -DesktopIcon
          if (Test-Path "$app\backend\cpu\stale-from-old.dll") { throw 'stale file from the old version survived the upgrade' }
          $j = Get-Content "$app\install.json" -Raw | ConvertFrom-Json
          if ($j.compute -ne 'cpu' -or -not $j.model_dir) { throw 'install.json content wrong' }
          "APP_DIR=$app" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: E2E in REAL WebView2 - launch installed app with a MISSING model folder, re-link, attach, camera, chat, save PDF
        if: matrix.bundle_webview2
        shell: pwsh
        run: |
          $good = "$env:RUNNER_TEMP\e2e-models"
          if (-not (Test-Path "$good\4b")) { New-Item -ItemType Directory -Force "$good\4b" | Out-Null; python tools/make_tiny_gemma3.py "$good\4b\medgemma-4b-it-F32.gguf" }
          # simulate: the folder the installer recorded has been moved/deleted
          '{ "compute": "cpu", "model_dir": "C:\\does-not-exist-medgemma" }' | Set-Content -Encoding utf8 "$env:APP_DIR\install.json"
          Remove-Item "$env:APPDATA\com.nouman.medgemma.offline" -Recurse -Force -ErrorAction SilentlyContinue
          $env:APP_EXE = "$env:APP_DIR\medgemma-offline.exe"; $env:GOOD_MODELS = $good; $env:WORK_DIR = "$env:RUNNER_TEMP\e2e-work"
          node tools/e2e_webview.mjs

      - name: UNINSTALL - silent, then verify ZERO leftovers (files, shortcuts, registry, user data, processes)
        if: always() && matrix.bundle_webview2 && env.APP_DIR != ''
        shell: pwsh
        run: |
          Get-Process -Name medgemma-offline,llama-server -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p = Start-Process "$env:APP_DIR\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          "uninstaller exit code: $($p.ExitCode)"
          Start-Sleep 4
          ./tools/verify_install.ps1 -Phase uninstalled -AppDir $env:APP_DIR

      - name: Upload test evidence (wizard screenshots + state log, e2e results + saved PDF, setup logs)
        if: always() && matrix.bundle_webview2
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/wizard-evidence/**
            ${{ runner.temp }}/e2e-work/e2e-results.json
            ${{ runner.temp }}/e2e-work/saved-report.pdf
            ${{ runner.temp }}/old.log
            ${{ runner.temp }}/upgrade.log

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/SHA256SUMS.txt

  # ---------------------------------------------------------------------------------------------
  # What a supervisor will actually do first: download the artifacts of this run and check them.
  # ---------------------------------------------------------------------------------------------
  verify-artifacts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MedGemmaOffline-installer-*
          path: artifacts
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check both installers (real Inno Setup executables, sizes, SHA-256 sums, bundled > slim)
        run: python tools/check_artifacts.py artifacts
